<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">RMS</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#rmsMenu"
            aria-controls="rmsMenu" aria-expanded="false" aria-label="Open menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="rmsMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1 pt-3 pt-lg-0 pb-2 pb-lg-0">
        <li class="nav-item" th:if="${session.user != null and (session.user.role.name() == 'MANAGER' or session.user.role.name() == 'CASHIER')}">
          <a class="nav-link px-3 rounded" href="/order/new">New order</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and (session.user.role.name() == 'MANAGER' or session.user.role.name() == 'CASHIER')}">
          <a class="nav-link px-3 rounded" href="/orders">Orders</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'KITCHEN'}">
          <a class="nav-link px-3 rounded" href="/kitchen">Kitchen</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'RIDER'}">
          <a class="nav-link px-3 rounded" href="/rider">Deliveries</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'MANAGER'}">
          <a class="nav-link px-3 rounded" href="/manager">Dashboard</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'MANAGER'}">
          <a class="nav-link px-3 rounded" href="/manager/menu">Menu</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'MANAGER'}">
          <a class="nav-link px-3 rounded" href="/manager/inventory">Inventory</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'MANAGER'}">
          <a class="nav-link px-3 rounded" href="/manager/reports">Reports</a>
        </li>
        <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'MANAGER'}">
          <a class="nav-link px-3 rounded" href="/manager/staff">Staff</a>
        </li>
        <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
          <form method="post" action="/logout" class="m-0">
            <button class="btn btn-outline-light w-100">Log out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/password-toggle.js" defer></script>
</nav>
</body>
</html>
