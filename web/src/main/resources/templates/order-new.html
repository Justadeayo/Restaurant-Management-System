<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - New order</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">New order</h1>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <form method="post" action="/order/new">
    <div class="table-responsive">
      <table class="table align-middle bg-white">
        <thead>
          <tr><th>Item</th><th>Category</th><th>Price</th><th style="width: 120px">Quantity</th></tr>
        </thead>
        <tbody>
          <tr th:each="item : ${items}">
            <td th:text="${item.name}"></td>
            <td th:text="${item.category}"></td>
            <td th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></td>
            <td>
              <input type="hidden" name="menuItemId" th:value="${item.id}">
              <input class="form-control" type="number" min="0" name="quantity" value="0">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <button class="btn btn-success">Send order</button>
  </form>
</div>
</body>
</html>
