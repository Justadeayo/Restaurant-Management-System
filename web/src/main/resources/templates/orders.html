<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Orders</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Orders</h1>
  <div class="row g-3">
    <div class="col-12 col-md-6" th:each="o : ${orders}">
      <div class="card card-body bg-white h-100">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <div class="fw-semibold fs-5" th:text="'Order #' + ${o.id}"></div>
            <div class="small text-muted">
              <span th:text="${o.orderType.name() == 'REMOTE' ? 'Delivery' : 'Table'}"></span>
              <span th:text="${o.orderType.name() == 'REMOTE' ? o.deliveryAddress : o.tableNumber}"></span>
            </div>
          </div>
          <span class="badge bg-secondary" th:text="${o.status}"></span>
        </div>
        <div class="d-flex justify-content-between small text-muted mb-3">
          <span th:text="'Total ' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></span>
          <span th:text="${#temporals.format(o.createdAt, 'dd MMM HH:mm')}"></span>
        </div>
        <a class="btn btn-success w-100" th:href="@{/orders/{id}(id=${o.id})}">Open order</a>
      </div>
    </div>
  </div>
  <p class="text-muted" th:if="${#lists.isEmpty(orders)}">No orders yet.</p>
</div>
</body>
</html>
