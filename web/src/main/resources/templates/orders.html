<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Orders</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Orders</h1>
  <div class="table-responsive">
    <table class="table align-middle bg-white">
      <thead>
        <tr><th>#</th><th>Cashier</th><th>Total</th><th>Status</th><th>Created</th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td><a th:href="@{/orders/{id}(id=${o.id})}" th:text="${o.id}"></a></td>
          <td th:text="${o.cashierName}"></td>
          <td th:text="${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></td>
          <td th:text="${o.status}"></td>
          <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
