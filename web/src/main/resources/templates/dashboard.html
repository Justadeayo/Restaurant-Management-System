<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-1">Dashboard</h1>
  <p class="text-muted mb-4" th:text="${#temporals.format(today, 'dd MMM yyyy')}"></p>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card card-body bg-white"><div class="small text-muted">Sales today</div>
        <div class="h5 mb-0" th:text="${#numbers.formatDecimal(salesToday, 1, 2)}"></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card card-body bg-white"><div class="small text-muted">Paid orders today</div>
        <div class="h5 mb-0" th:text="${ordersToday}"></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card card-body bg-white"><div class="small text-muted">Open (unpaid) orders</div>
        <div class="h5 mb-0" th:text="${openOrders}"></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card card-body bg-white"><div class="small text-muted">Low-stock items</div>
        <div class="h5 mb-0" th:text="${lowStock.size()}"></div></div>
    </div>
  </div>

  <h2 class="h6">Low stock</h2>
  <div class="table-responsive">
    <table class="table bg-white align-middle">
      <thead><tr><th>Item</th><th>Stock</th><th>Low at</th></tr></thead>
      <tbody>
        <tr th:each="item : ${lowStock}">
          <td th:text="${item.name}"></td>
          <td th:text="${item.stockQuantity}"></td>
          <td th:text="${item.lowStockThreshold}"></td>
        </tr>
        <tr th:if="${lowStock.isEmpty()}"><td colspan="3" class="text-muted">Nothing is low right now.</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
