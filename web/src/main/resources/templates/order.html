<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Order</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Order #<span th:text="${order.id}"></span></h1>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert-success" th:if="${paid}">This order is paid.</div>

  <div class="table-responsive mb-3">
    <table class="table align-middle bg-white">
      <thead>
        <tr><th>Item</th><th>Price</th><th>Quantity</th><th>Subtotal</th></tr>
      </thead>
      <tbody>
        <tr th:each="line : ${lines}">
          <td th:text="${line.itemName}"></td>
          <td th:text="${#numbers.formatDecimal(line.unitPrice, 1, 2)}"></td>
          <td th:text="${line.quantity}"></td>
          <td th:text="${#numbers.formatDecimal(line.subtotal, 1, 2)}"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr><th colspan="3">Total</th><th th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></th></tr>
      </tfoot>
    </table>
  </div>

  <form method="post" th:action="@{/orders/{id}/pay(id=${order.id})}" th:unless="${paid}" class="card card-body bg-white">
    <div class="row g-2 align-items-end">
      <div class="col-sm-6">
        <label class="form-label" for="method">Payment method</label>
        <select class="form-select" id="method" name="method">
          <option th:each="m : ${methods}" th:value="${m.name()}" th:text="${m}"></option>
        </select>
      </div>
      <div class="col-sm-6">
        <button class="btn btn-success w-100">Record payment</button>
      </div>
    </div>
  </form>
</div>
</body>
</html>
