<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Inventory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Inventory</h1>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="table-responsive">
    <table class="table align-middle bg-white">
      <thead>
        <tr><th>Item</th><th>Category</th><th>Stock</th><th>Low at</th><th>Status</th><th>Adjust stock</th></tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td th:text="${item.name}"></td>
          <td th:text="${item.category}"></td>
          <td th:text="${item.stockQuantity}"></td>
          <td th:text="${item.lowStockThreshold}"></td>
          <td><span class="badge" th:classappend="${item.lowStock} ? 'bg-danger' : 'bg-success'" th:text="${item.lowStock} ? 'LOW STOCK' : 'OK'"></span></td>
          <td>
            <form method="post" th:action="@{/manager/inventory/{id}/adjust(id=${item.id})}" class="d-flex gap-1 m-0">
              <input class="form-control form-control-sm" style="width: 90px" type="number" min="1" name="quantity" value="1" required>
              <button class="btn btn-sm btn-outline-success" name="action" value="add">Add</button>
              <button class="btn btn-sm btn-outline-danger" name="action" value="remove">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
