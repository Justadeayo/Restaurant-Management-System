<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Track order</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .track-step { position: relative; padding: 0 0 22px 40px; }
    .track-step:last-child { padding-bottom: 0; }
    .track-step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: #dee2e6; }
    .track-step:last-child::before { display: none; }
    .track-step.done::before { background: #198754; }
    .track-dot { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%;
                 border: 2px solid #adb5bd; background: #fff; color: #fff; font-size: 14px; line-height: 24px; text-align: center; }
    .track-step.done .track-dot { background: #198754; border-color: #198754; }
    .track-step.current .track-dot { border-color: #ffc107; box-shadow: 0 0 0 4px #fff3cd; background: #fff; }
    .track-step.current .track-dot::after { content: ""; display: block; width: 10px; height: 10px; margin: 7px auto; border-radius: 50%; background: #ffc107; }
    .track-step.todo .track-label { color: #6c757d; }
  </style>
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <a href="/my-orders">&larr; My orders</a>
  <h1 class="h4 mt-2 mb-3">Order #<span th:text="${order.id}"></span></h1>

  <div class="alert alert-success" th:if="${param.placed != null or placed != null}">Thank you! Your order has been placed.</div>
  <div class="alert alert-success" th:if="${paid}">Payment received. Thank you!</div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card card-body bg-white mb-3">
    <p class="mb-1" th:if="${order.deliveryAddress != null}">Delivery address: <span th:text="${order.deliveryAddress}"></span></p>
    <p class="mb-0">
      <span class="badge text-bg-success" th:if="${order.status.name() == 'COMPLETED'}">Completed</span>
      <span class="badge text-bg-warning" th:unless="${order.status.name() == 'COMPLETED'}">&bull; Order pending</span>
    </p>
  </div>

  <div class="card card-body bg-white mb-3">
    <h2 class="h6 mb-3">Tracking</h2>
    <div th:each="step : ${steps}" class="track-step" th:classappend="${step.state}">
      <span class="track-dot">
        <span th:if="${step.state == 'done'}">&#10003;</span>
      </span>
      <div class="track-label" th:classappend="${step.state == 'todo'} ? 'text-muted' : 'fw-semibold'" th:text="${step.label}"></div>
      <div class="small text-muted" th:if="${step.state == 'current'}">In progress</div>
    </div>
  </div>

  <div class="card card-body bg-white mb-3" th:if="${order.status.name() == 'OUT_FOR_DELIVERY'}">
    <h2 class="h6">Your rider has arrived</h2>
    <p class="text-muted small mb-3">Pay now to complete your order.</p>
    <form method="post" th:action="@{/my-orders/{id}/pay(id=${order.id})}">
      <button class="btn btn-success w-100">Pay now</button>
    </form>
  </div>

  <div class="card card-body bg-white">
    <h2 class="h6">Items</h2>
    <table class="table mb-0">
      <tr th:each="item : ${items}">
        <td th:text="${item.quantity} + ' x ' + ${item.itemName}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
