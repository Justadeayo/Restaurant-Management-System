<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Kitchen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Kitchen</h1>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <p class="text-muted" th:if="${#lists.isEmpty(orders)}">No orders waiting.</p>
  <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
    <table class="table align-middle bg-white">
      <thead>
        <tr><th>#</th><th>Type</th><th>Table / address</th><th>Items</th><th>Placed</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="${o.id}"></td>
          <td th:text="${o.orderType}"></td>
          <td th:text="${o.tableNumber != null ? o.tableNumber : o.deliveryAddress}"></td>
          <td>
            <div th:each="line : ${o.orderItems}" th:text="${line.quantity + ' x ' + line.itemName}"></div>
          </td>
          <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}"></td>
          <td>
            <form method="post" th:action="@{/kitchen/orders/{id}/ready(id=${o.id})}">
              <button class="btn btn-success btn-sm">Ready</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
