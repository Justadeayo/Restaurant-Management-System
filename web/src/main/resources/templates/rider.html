<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Deliveries</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Deliveries</h1>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <p class="text-muted" th:if="${#lists.isEmpty(orders)}">No deliveries waiting.</p>
  <div class="row g-3" th:unless="${#lists.isEmpty(orders)}">
    <div class="col-12 col-md-6" th:each="o : ${orders}">
      <div class="card card-body bg-white h-100">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div class="fw-semibold fs-5" th:text="'Order #' + ${o.id}"></div>
          <span class="badge bg-secondary" th:text="${o.status}"></span>
        </div>
        <div class="mb-3">
          <div class="small text-muted">Deliver to</div>
          <div th:text="${o.deliveryAddress}"></div>
        </div>
        <form method="post" th:action="@{/rider/orders/{id}/advance(id=${o.id})}" class="m-0">
          <button class="btn btn-success w-100" th:text="'Mark as ' + ${o.nextStatus()}"></button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
