<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Menu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Menu</h1>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card card-body bg-white mb-4">
    <h2 class="h6">Add an item</h2>
    <form method="post" action="/manager/menu" class="row g-2 align-items-end">
      <div class="col-md-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
      <div class="col-md-2"><label class="form-label">Category</label><input class="form-control" name="category"></div>
      <div class="col-md-2"><label class="form-label">Price</label><input class="form-control" type="number" step="0.01" min="0" name="price" required></div>
      <div class="col-md-2"><label class="form-label">Stock</label><input class="form-control" type="number" min="0" name="stock" value="0" required></div>
      <div class="col-md-2"><label class="form-label">Low-stock level</label><input class="form-control" type="number" min="0" name="threshold" value="10" required></div>
      <div class="col-md-1"><button class="btn btn-success w-100">Add</button></div>
    </form>
  </div>

  <div class="table-responsive">
    <table class="table align-middle bg-white">
      <thead>
        <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Low at</th><th>Available</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td colspan="7" class="p-0">
            <form method="post" th:action="@{/manager/menu/{id}(id=${item.id})}" class="row g-2 align-items-center p-2 m-0">
              <div class="col-md-3"><input class="form-control" name="name" th:value="${item.name}" required></div>
              <div class="col-md-2"><input class="form-control" name="category" th:value="${item.category}"></div>
              <div class="col-md-2"><input class="form-control" type="number" step="0.01" min="0" name="price" th:value="${item.price}" required></div>
              <div class="col-md-1"><input class="form-control" type="number" min="0" name="stock" th:value="${item.stockQuantity}" required></div>
              <div class="col-md-1"><input class="form-control" type="number" min="0" name="threshold" th:value="${item.lowStockThreshold}" required></div>
              <div class="col-md-1"><div class="form-check"><input class="form-check-input" type="checkbox" value="true" name="available" th:checked="${item.available}"></div></div>
              <div class="col-md-2"><button class="btn btn-outline-success btn-sm w-100">Save</button></div>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="text-muted small">Untick Available to take an item off the order screen. Items are never deleted, so past orders keep their history.</p>
</div>
</body>
</html>
