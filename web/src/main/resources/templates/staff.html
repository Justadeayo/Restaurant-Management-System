<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Staff</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Staff</h1>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card card-body bg-white mb-4">
    <h2 class="h6 mb-3">Add a staff account</h2>
    <form method="post" action="/manager/staff" class="row g-2">
      <div class="col-12 col-md-4">
        <label class="form-label" for="newUsername">Username</label>
        <input class="form-control" id="newUsername" name="username" required>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="newPassword">Password</label>
        <input class="form-control" id="newPassword" type="password" name="password" minlength="6" required>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="newRole">Role</label>
        <select class="form-select" id="newRole" name="role">
          <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r}"></option>
        </select>
      </div>
      <div class="col-12 col-md-2 d-flex align-items-end">
        <button class="btn btn-success w-100">Add</button>
      </div>
    </form>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6" th:each="u : ${users}">
      <div class="card card-body bg-white h-100">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <div class="fw-semibold fs-5" th:text="${u.username}"></div>
            <div class="small text-muted" th:text="${u.role}"></div>
          </div>
          <span class="badge fs-6" th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'" th:text="${u.active} ? 'Active' : 'Inactive'"></span>
        </div>

        <form method="post" th:action="@{/manager/staff/{id}/password(id=${u.id})}" class="mb-3">
          <label class="form-label small mb-1" th:for="'pw' + ${u.id}">Change password</label>
          <div class="input-group">
            <input class="form-control" th:id="'pw' + ${u.id}" type="password" name="password" minlength="6" placeholder="New password" required>
            <button class="btn btn-outline-secondary">Change</button>
          </div>
        </form>

        <div class="d-grid gap-2">
          <form method="post" th:action="@{/manager/staff/{id}/status(id=${u.id})}" class="m-0">
            <input type="hidden" name="active" th:value="${!u.active}">
            <button class="btn w-100" th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                    th:text="${u.active} ? 'Deactivate' : 'Activate'"></button>
          </form>
          <form method="post" th:action="@{/manager/staff/{id}/remove-access(id=${u.id})}" class="m-0"
                onsubmit="return confirm('Remove access? The account cannot sign in and its password will be replaced.');">
            <button class="btn btn-outline-warning w-100">Remove access</button>
          </form>
          <form method="post" th:action="@{/manager/staff/{id}/delete(id=${u.id})}" class="m-0"
                onsubmit="return confirm('Delete this account? This cannot be undone.');">
            <button class="btn btn-outline-danger w-100">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
