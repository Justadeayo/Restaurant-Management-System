<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - Staff</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <h1 class="h4 mb-3">Staff</h1>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card card-body bg-white mb-4">
    <h2 class="h6">Add a staff account</h2>
    <form method="post" action="/manager/staff" class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
      <div class="col-md-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required></div>
      <div class="col-md-3">
        <label class="form-label">Role</label>
        <select class="form-select" name="role">
          <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r}"></option>
        </select>
      </div>
      <div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
    </form>
  </div>

  <div class="table-responsive">
    <table class="table align-middle bg-white">
      <thead><tr><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.username}"></td>
          <td th:text="${u.role}"></td>
          <td><span class="badge" th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'" th:text="${u.active} ? 'Active' : 'Inactive'"></span></td>
          <td>
            <form method="post" th:action="@{/manager/staff/{id}/status(id=${u.id})}" class="m-0">
              <input type="hidden" name="active" th:value="${!u.active}">
              <button class="btn btn-sm" th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                      th:text="${u.active} ? 'Deactivate' : 'Activate'"></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
