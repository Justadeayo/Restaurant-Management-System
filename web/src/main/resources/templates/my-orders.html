<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS - My orders</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">My orders</h1>
    <a class="btn btn-success btn-sm" href="/shop">Order online</a>
  </div>
  <p class="text-muted" th:if="${#lists.isEmpty(orders)}">You have no orders yet.</p>
  <div class="row g-3">
    <div class="col-12 col-md-6" th:each="order : ${orders}">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h2 class="h6">Order #<span th:text="${order.id}"></span></h2>
          <p class="mb-2">
            <span class="badge text-bg-success" th:if="${order.status.name() == 'COMPLETED'}">Completed</span>
            <span class="badge text-bg-warning" th:unless="${order.status.name() == 'COMPLETED'}">&bull; Order pending</span>
          </p>
          <p class="mb-3">Total: <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></p>
          <a class="btn btn-outline-success btn-sm" th:href="@{/my-orders/{id}(id=${order.id})}">Track order</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
